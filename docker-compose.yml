version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: eduproctor_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: eduproctor
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: eduproctor_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/eduproctor
      JWT_SECRET: eduproctor-super-secret-jwt-key-2026
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: eduproctor_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
